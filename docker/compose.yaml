# OpenCart test stores for the Translate Expert module. See docker/README.md.
#
#   docker compose -f docker/compose.yaml up -d --build          # all stores
#   docker compose -f docker/compose.yaml up -d --build oc30     # one store
#   docker/install-module.sh all                                 # install module
#   docker compose -f docker/compose.yaml down -v                # tear down

name: ote-test

x-store-env: &store-env
  DB_HOST: db
  DB_USER: opencart
  DB_PASSWORD: opencart
  OC_ADMIN_USER: admin
  OC_ADMIN_PASSWORD: admin
  OC_ADMIN_EMAIL: admin@example.com

services:
  db:
    image: mariadb:10.6
    # OC 2.3 and older do not reset sql_mode on connect, and their installers
    # and admins write rows that strict mode rejects.
    command: ["--sql-mode=", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    environment:
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  # OC 1.5.6.4, 2.0.3.1 and 2.1.0.2 have no release zip, so these stores use
  # GitHub's tag archive. GitHub does not promise that its bytes never change:
  # if the SHA-256 check fails, check the archive and update the hash.
  # OC 1.5 has no OCMOD; the store gets vQmod, which reads the module's XML.
  # OC 1.5 needs the PHP 5 mysql extension, so PHP 5.6 is the newest it runs on.
  oc15:
    build:
      context: ./opencart
      args:
        PHP_IMAGE: php:5.6-apache
        OC_URL: https://github.com/opencart/opencart/archive/refs/tags/1.5.6.4.zip
        OC_SHA256: afde29ca67293d1943ceca0a122cfab472a57f9cc8dd50b0dd1a339fa3da8a24
        OC_UPLOAD_DIR: opencart-1.5.6.4/upload
        VQMOD_URL: https://github.com/vqmod/vqmod/releases/download/v2.6.6-opencart/vqmod-2.6.6-opencart.zip
        VQMOD_SHA256: f10729ee98dc4d6697d860693aa16868acaafd57fef0b2538fd3f017b1860cab
    image: ote-test/opencart:1.5.6.4
    ports:
      - "127.0.0.1:${OC15_PORT:-8015}:80"
    environment:
      <<: *store-env
      DB_NAME: oc15
      OC_HTTP_SERVER: http://localhost:${OC15_PORT:-8015}/
    depends_on:
      db:
        condition: service_healthy

  oc20:
    build:
      context: ./opencart
      args:
        PHP_IMAGE: php:5.6-apache
        OC_URL: https://github.com/opencart/opencart/archive/refs/tags/2.0.3.1.zip
        OC_SHA256: ea50be8daf72dbc93b720e34e264aef07d35d47a8c1d48f80b4f3073c77700e4
        OC_UPLOAD_DIR: opencart-2.0.3.1/upload
    image: ote-test/opencart:2.0.3.1
    ports:
      - "127.0.0.1:${OC20_PORT:-8020}:80"
    environment:
      <<: *store-env
      DB_NAME: oc20
      OC_HTTP_SERVER: http://localhost:${OC20_PORT:-8020}/
    depends_on:
      db:
        condition: service_healthy

  oc21:
    build:
      context: ./opencart
      args:
        PHP_IMAGE: php:5.6-apache
        OC_URL: https://github.com/opencart/opencart/archive/refs/tags/2.1.0.2.zip
        OC_SHA256: 4c2d581228372d0a133b9b74b7ed101dc33299c9f0adb35326826c48a4cb3ce1
        OC_UPLOAD_DIR: opencart-2.1.0.2/upload
    image: ote-test/opencart:2.1.0.2
    ports:
      - "127.0.0.1:${OC21_PORT:-8021}:80"
    environment:
      <<: *store-env
      DB_NAME: oc21
      OC_HTTP_SERVER: http://localhost:${OC21_PORT:-8021}/
    depends_on:
      db:
        condition: service_healthy

  oc22:
    build:
      context: ./opencart
      args:
        PHP_IMAGE: php:5.6-apache
        OC_URL: https://github.com/opencart/opencart/releases/download/2.2.0.0/2.2.0.0-compiled.zip
        OC_SHA256: fdf0beb0ceedb8f7818a10a0b55359f808f1794d8d9db656f2b4fede3cf2d648
        OC_UPLOAD_DIR: 2.2.0.0-compiled/upload
    image: ote-test/opencart:2.2.0.0
    ports:
      - "127.0.0.1:${OC22_PORT:-8022}:80"
    environment:
      <<: *store-env
      DB_NAME: oc22
      OC_HTTP_SERVER: http://localhost:${OC22_PORT:-8022}/
    depends_on:
      db:
        condition: service_healthy

  oc23:
    build:
      context: ./opencart
      args:
        PHP_IMAGE: php:5.6-apache
        OC_URL: https://github.com/opencart/opencart/releases/download/2.3.0.2/2.3.0.2-compiled.zip
        OC_SHA256: 4b8e0c2132e158863edaa869442614c4cea1502aa4d22308bd8449d6befb6862
        OC_UPLOAD_DIR: upload
    image: ote-test/opencart:2.3.0.2
    ports:
      - "127.0.0.1:${OC23_PORT:-8023}:80"
    environment:
      <<: *store-env
      DB_NAME: oc23
      OC_HTTP_SERVER: http://localhost:${OC23_PORT:-8023}/
    depends_on:
      db:
        condition: service_healthy

  oc30:
    build:
      context: ./opencart
      args:
        PHP_IMAGE: php:7.4-apache
        OC_URL: https://github.com/opencart/opencart/releases/download/3.0.3.9/opencart-3.0.3.9.zip
        OC_SHA256: 9ad297bec682a6a13567ca4061c52829a512890819d1f54b3a465c929e7b3241
        OC_UPLOAD_DIR: upload
    image: ote-test/opencart:3.0.3.9
    ports:
      - "127.0.0.1:${OC30_PORT:-8030}:80"
    environment:
      <<: *store-env
      DB_NAME: oc30
      OC_HTTP_SERVER: http://localhost:${OC30_PORT:-8030}/
    depends_on:
      db:
        condition: service_healthy

  oc40:
    build:
      context: ./opencart
      args:
        PHP_IMAGE: php:8.1-apache
        OC_URL: https://github.com/opencart/opencart/releases/download/4.0.2.3/opencart-4.0.2.3.zip
        OC_SHA256: 8d18dc67e23d9937925e2efb470f6fabed98aeafd64550c43b6f413d174e5117
        OC_UPLOAD_DIR: opencart-4.0.2.3/upload
    image: ote-test/opencart:4.0.2.3
    ports:
      - "127.0.0.1:${OC40_PORT:-8040}:80"
    environment:
      <<: *store-env
      DB_NAME: oc40
      OC_HTTP_SERVER: http://localhost:${OC40_PORT:-8040}/
    depends_on:
      db:
        condition: service_healthy

  # OC 4.1 needs PHP 8.1+. PHP 8.2 is used so its new deprecations
  # (e.g. "${var}" interpolation) show up in the page.
  oc41:
    build:
      context: ./opencart
      args:
        PHP_IMAGE: php:8.2-apache
        OC_URL: https://github.com/opencart/opencart/releases/download/4.1.0.4/opencart-4.1.0.4.zip
        OC_SHA256: cdef537f5a0a7e1b4ddbe16f589dd2e80b10150a09bfbe93ce76ef2d5c3218c0
        OC_UPLOAD_DIR: upload
    image: ote-test/opencart:4.1.0.4
    ports:
      - "127.0.0.1:${OC41_PORT:-8041}:80"
    environment:
      <<: *store-env
      DB_NAME: oc41
      OC_HTTP_SERVER: http://localhost:${OC41_PORT:-8041}/
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
